[project]
name = "patch-upload"
version = "0.1.0"
description = "Ansible automation that schedules patch info collection and upload"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ansible-core>=2.16",
    "ansible-lint>=24.0",
    "yamllint>=1.35",
    "pytest>=8.0",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
